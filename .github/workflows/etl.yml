name: Channel Map ETL 

on:
  schedule:
    - cron: '0 0 * * 5'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rir-tracking

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      
      - name: Run ETL Process
        id: etl
        run: |
          go run ./cmd/etl/main.go

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update channel map"
          file_pattern: ./internal/channel/data/channel-map.gz
          branch: rir-tracking